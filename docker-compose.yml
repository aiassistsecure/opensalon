services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opensalon}
      POSTGRES_USER: ${POSTGRES_USER:-opensalon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensalon-dev-only}
    volumes:
      - opensalon-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opensalon}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      OPENSALON_SECRET_KEY: ${OPENSALON_SECRET_KEY:-dev-only-change-me}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-opensalon}
      POSTGRES_USER: ${POSTGRES_USER:-opensalon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensalon-dev-only}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  opensalon-db:
