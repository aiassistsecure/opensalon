<a class="appt-block status-{{ block.status }}" {% if block.url %}href="{{ block.url }}"{% endif %} {% if block.appointment_id %}data-appt-id="{{ block.appointment_id }}"{% endif %} style="top:{{ block.top }}%;height:{{ block.height }}%;--wash:{{ block.wash }};--ink:{{ block.ink }};">
  <span class="appt-top">
    <span class="appt-client">{{ block.client_name }}</span>
    <span class="appt-status"><span class="status-dot"></span>{{ block.status_label }}</span>
  </span>
  <span class="appt-service">{{ block.service_name }}{% if block.category %} · {{ block.category }}{% endif %}</span>
  <span class="appt-time">{{ block.time_label }}</span>
  {% if block.note %}<span class="appt-note">{{ block.note }}</span>{% endif %}
</a>
