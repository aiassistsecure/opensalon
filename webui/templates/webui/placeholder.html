{% extends "webui/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <h1 class="page-title">{{ title }}</h1>
    <p class="page-subtitle">{{ lane_note }}</p>
  </div>
</section>
<div class="empty-card">
  <div class="empty-arch" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c1.8 2.6 1.8 5.4 0 8-1.8-2.6-1.8-5.4 0-8Z"/><path d="M5.5 8.5c3.2.3 5.4 2 6.5 4.9-3.2-.3-5.4-2-6.5-4.9Z"/><path d="M18.5 8.5c-3.2.3-5.4 2-6.5 4.9 3.2-.3 5.4-2 6.5-4.9Z"/></svg>
  </div>
  <h2 class="empty-title">On its way</h2>
  <p>This room of the salon is still being decorated. The day book, clients and price book are open today.</p>
  <p class="empty-action"><a class="btn btn-gold" href="{% url 'webui:daybook' %}">Open the day book</a></p>
</div>
{% endblock %}
